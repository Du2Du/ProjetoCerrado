services:
  db:
    image: postgres:16-alpine
    container_name: guia-cerrado-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: guia-cerrado-backend
    restart: always
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: guia-cerrado-frontend
    restart: always
    ports:
      - "8080:80"

volumes:
  postgres_data: